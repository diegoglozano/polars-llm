name: accel-wheels

# Builds the optional native accelerator `polars-llm-accel` (the `accel/` crate)
# as wheels across platforms, smoke-tests the native plugin, and — on a GitHub
# release — publishes to PyPI. The base `polars-llm` package is unaffected.

on:
  push:
    branches: [main]
    paths: ["accel/**", ".github/workflows/accel.yml"]
  pull_request:
    paths: ["accel/**", ".github/workflows/accel.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: macos-13, target: x86_64, manylinux: "" }
          - { runner: macos-14, target: aarch64, manylinux: "" }
          - { runner: windows-latest, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          python - <<'PY'
          import os, re, pathlib
          ver = os.environ["GITHUB_REF"].split("/")[-1].lstrip("v")
          p = pathlib.Path("accel/pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = ".*"', f'version = "{ver}"', p.read_text(), count=1))
          print("accel version ->", ver)
          PY
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: accel
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: accel/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          python - <<'PY'
          import os, re, pathlib
          ver = os.environ["GITHUB_REF"].split("/")[-1].lstrip("v")
          p = pathlib.Path("accel/pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = ".*"', f'version = "{ver}"', p.read_text(), count=1))
          PY
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: accel
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: accel/dist

  smoke:
    name: smoke-test native plugin
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist
      - name: Install (ABI-compatible polars) + run the native OpenAI counter
        run: |
          python -m pip install --upgrade pip
          # Pin polars to the ABI the accel was built against; install the base
          # package and the accel wheel without letting pip move polars.
          pip install "polars>=1.40,<1.41" "langchain-core>=0.3.0" "nest-asyncio>=1.6.0"
          pip install --no-deps .
          pip install --no-deps dist/*.whl
          python - <<'PY'
          import polars as pl
          import polars_llm  # noqa: F401  registers `.llm`
          from polars_llm import _tokens as t
          assert t._ACCEL is not None, "native accelerator not importable"
          # tiktoken-rs bundles the vocab, so this needs no network:
          n = pl.DataFrame({"x": ["hello world", "", None]}).with_columns(
              pl.col("x").llm.openai_tokens(model="gpt-4o").alias("n")
          )["n"].to_list()
          assert n == [2, 0, None], n
          print("native OpenAI count OK:", n)
          PY

  publish:
    name: publish to PyPI
    needs: [build, sdist, smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          pip install twine
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          # Add a repository secret PYPI_TOKEN_ACCEL scoped to the
          # `polars-llm-accel` PyPI project (separate from the base package's
          # PYPI_TOKEN).
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_ACCEL }}
