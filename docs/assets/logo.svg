<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="polars-llm logo">
  <title>polars-llm</title>
  <desc>A speech bubble containing stacked DataFrame rows with a sparkle accent.</desc>

  <!-- Chat bubble: rounded rectangle with a small tail -->
  <path d="
      M 52 24
      H 220
      A 24 24 0 0 1 244 48
      V 168
      A 24 24 0 0 1 220 192
      H 124
      L 76 232
      L 84 192
      H 52
      A 24 24 0 0 1 28 168
      V 48
      A 24 24 0 0 1 52 24
      Z"
    fill="#0E1525"/>

  <!-- DataFrame rows -->
  <rect x="56" y="64"  width="124" height="16" rx="5" fill="#F08F39"/>
  <rect x="56" y="92"  width="160" height="16" rx="5" fill="#FFFFFF"/>
  <rect x="56" y="120" width="100" height="16" rx="5" fill="#F08F39"/>
  <rect x="56" y="148" width="140" height="16" rx="5" fill="#FFFFFF"/>

  <!-- Sparkle accent (AI) -->
  <path d="M 220 36
           L 226 56
           L 246 62
           L 226 68
           L 220 88
           L 214 68
           L 194 62
           L 214 56
           Z"
        fill="#F08F39"/>
</svg>
